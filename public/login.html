<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · OwnerFieldOps</title><link rel="stylesheet" href="/css/app.css"></head>
<body><main style="max-width:420px;margin:8vh auto;padding:20px">
  <h1>OwnerFieldOps</h1><div class="card">
  <h2>Sign in</h2>
  <label class="field"><span>Account</span><select id="role"><option value="owner">Owner</option><option value="worker">Worker</option></select></label>
  <form id="login">
    <label class="field" id="ownerField"><span>Owner password</span><input id="password" type="password" autocomplete="current-password"></label>
    <div id="workerFields" hidden>
      <label class="field"><span>Worker ID</span><input id="workerId" inputmode="numeric" autocomplete="username"></label>
      <label class="field"><span>PIN</span><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></label>
      <p>Use the worker ID and PIN provided by the owner.</p>
    </div>
    <button class="btn" id="submit" type="submit">Sign in</button>
    <p id="error" role="alert"></p>
  </form></div>
  <script type="module" src="/js/login.js"></script>
</main></body></html>
